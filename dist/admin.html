<!DOCTYPE html>

  <!-- Painel de gestão clínica. Não indexar, não seguir, não arquivar:

  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">

  <!-- Defesa em profundidade no próprio documento. Os cabeçalhos HTTP
       equivalentes (CSP completa, HSTS, X-Frame-Options) são configurados no
       servidor — ver docs/SEGURANCA-DEPLOY.md. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <title>Gestão Clínica — Dr. Charlington M. Cavalcante</title>

  <link rel="icon" href="/assets/logo-CSButMZm.svg" type="image/svg+xml">

  <!-- A fonte Inter é auto-hospedada em admin/assets/fonts. Nenhuma requisição
       a domínio de terceiro: sem isso a CSP não poderia usar style-src 'self'
       e o IP de quem usa o painel vazaria para o Google a cada carga. -->
  <link rel="preload" href="/assets/inter-latin-8kRkwJBP.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/urbanist-normal-latin-CZ4Yy-Rb.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" crossorigin src="/assets/admin-CzEJwTi0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/client-D9hV86iM.js">
  <link rel="stylesheet" crossorigin href="/assets/admin-jEMHN4U1.css">
</head>

<body>

    <!-- Estado de carga antes do JavaScript assumir. -->

  <noscript>

    </div>

</body>

</html>
